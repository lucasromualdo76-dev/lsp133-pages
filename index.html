<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4511e"><title>Central Operacional | LSP 133</title>
<style>
:root{color-scheme:light;--orange:#ee4d2d;--navy:#172338;--green:#07825d;--ink:#1d2939;--muted:#667085;--border:#e7eaf0;--bg:#f5f7fb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.top{max-width:1450px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 24px}
.brand{display:flex;align-items:center;gap:12px}.mark{background:var(--orange);color:white;border-radius:12px;font-size:19px;font-weight:900;width:42px;height:42px;display:grid;place-items:center}.brand b{font-size:17px}.sub{color:var(--muted);font-size:12px}.demo{color:#9a4a0a;background:#fff1df;border:1px solid #ffd49a;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:750}
main{max-width:1450px;margin:auto;padding:22px 24px 48px}.intro{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}.intro h1{margin:0;font-size:24px;letter-spacing:-.6px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 0 14px}.tab{border:1px solid var(--border);background:white;border-radius:10px;padding:11px 15px;white-space:nowrap;font-weight:700;color:#475467;cursor:pointer}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}input,select{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font:inherit;background:white;color:var(--ink)}button{font:inherit;cursor:pointer}.action{border:1px solid var(--border);border-radius:9px;background:white;padding:9px 13px;font-weight:700}.action:hover,.tab:hover{border-color:#9daec6}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric,.panel{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 20px #1f355206}.metric{padding:19px}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .number{font-size:29px;font-weight:800;line-height:1.4;letter-spacing:-.8px}.metric .foot{font-size:12px;color:var(--muted)}.metric .trend{font-weight:800;color:var(--green)}
.section{margin:24px 0 12px}.section h2{font-size:18px;margin:0}.section p{color:var(--muted);margin:2px 0;font-size:12px}.panel{padding:18px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel h3{font-size:16px;margin:0}.panel .desc{color:var(--muted);font-size:12px;margin:2px 0 12px}.chart{width:100%;overflow:hidden}.chart svg{width:100%;height:auto;display:block;max-height:365px}.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12px;margin:9px 0 0}.legend i{width:9px;height:9px;display:inline-block;border-radius:3px;margin-right:5px}.data-table{width:100%;border-collapse:collapse;min-width:600px}.data-table th,.data-table td{border-bottom:1px solid var(--border);padding:12px 10px;text-align:right;font-variant-numeric:tabular-nums}.data-table th:first-child,.data-table td:first-child{text-align:left}.data-table th{background:#f8fafc;color:#475467;font-size:12px}.data-table tr:hover td{background:#fafcff}.scroll{overflow:auto}.notes{border-left:3px solid var(--orange);background:#fff8f3;border-radius:9px;padding:12px 16px;font-size:13px}.empty{padding:32px;text-align:center;color:var(--muted)}.footer{margin-top:22px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top,main{padding-left:14px;padding-right:14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.metric .number{font-size:26px}.intro h1{font-size:20px}.demo{font-size:10px}}
@media print{header,.tabs,.toolbar,.action{display:none!important}main{padding:0}.panel,.metric{break-inside:avoid}.notes{break-inside:avoid}body{background:white}@page{size:A3 landscape;margin:10mm}}
</style></head><body>
<header><div class="top"><div class="brand"><div class="mark">S</div><div><b>Central Operacional · LSP 133</b><div class="sub">Painel de monitoramento operacional</div></div></div><span class="demo">DADOS DEMONSTRATIVOS</span></div></header>
<main><div class="intro"><div><h1 id="page-title">Controle de Produção</h1><div class="sub" id="page-sub">Indicadores operacionais por data</div></div><div class="sub" id="updated">Aguardando dados…</div></div>
<nav class="tabs" id="tabs" aria-label="Páginas da dashboard"><button class="tab active" data-page="producao">Controle de Produção</button><button class="tab" data-page="insucessos">Insucessos</button><button class="tab" data-page="erros">Erros de Expedição</button><button class="tab" data-page="atribuicao">Expedição de Rotas</button></nav>
<div class="toolbar"><label class="field">Data inicial<input type="date" id="start"></label><label class="field">Data final<input type="date" id="end"></label><button class="action" id="reload">↻ Atualizar</button><button class="action" onclick="window.print()">Imprimir / PDF</button><span class="sub" id="count"></span></div>
<div id="root" aria-live="polite"><div class="empty">Carregando dados demonstrativos…</div></div>
<footer class="footer"><span>Central Operacional LSP 133 · origem indicada no painel</span><span>GitHub Pages · última publicação no topo</span></footer>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('pt-BR'),pct=n=>(n>=0?'+':'')+n.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#07825d','#ee4d2d','#172338'];let state={page:'producao',data:null,rows:[]};
const pages={producao:['Controle de Produção','Evolução diária de rotas e pacotes'],insucessos:['Insucessos','Visão ilustrativa de tratativas e ocorrências'],erros:['Erros de Expedição','Visão ilustrativa de controle da qualidade'],atribuicao:['Expedição de Rotas','Evolução diária das atribuições de motoristas']};
function metric(label,value,foot){return '<div class="metric"><div class="label">'+escapeHtml(label)+'</div><div class="number">'+escapeHtml(value)+'</div><div class="foot">'+escapeHtml(foot)+'</div></div>'}
function sum(a,key){return a.reduce((n,r)=>n+Number(r[key]||0),0)}
function formatDate(date){let [y,m,d]=date.split('-');return d+'/'+m+'/'+y}
function fmtShort(date){let [y,m,d]=date.split('-');return d+'/'+m}
function legend(items){return '<div class="legend">'+items.map((s,i)=>'<span><i style="background:'+COLORS[i%COLORS.length]+'"></i>'+escapeHtml(s.name)+'</span>').join('')+'</div>'}
function lineChart(rows,items){if(!rows.length)return '<div class="empty">Sem dados no período.</div>';let W=1060,H=300,L=58,R=25,T=38,B=45,n=rows.length,max=Math.max(1,...rows.flatMap(r=>items.map(it=>Number(r[it.key]||0)))), ymax=Math.ceil(max/10)*10||10, innerW=W-L-R,innerH=H-T-B; const x=i=>L+(n===1?innerW/2:i*innerW/(n-1)),y=v=>T+(1-v/ymax)*innerH;let paths='';
for(let k=0;k<=4;k++){let val=ymax*k/4,yp=y(val);paths+='<line x1="'+L+'" y1="'+yp+'" x2="'+(W-R)+'" y2="'+yp+'" stroke="#e8ecf2"/><text x="'+(L-10)+'" y="'+(yp+4)+'" text-anchor="end" fill="#738095" font-size="12">'+fmt(Math.round(val))+'</text>'}
items.forEach((it,j)=>{let pts=rows.map((r,i)=>x(i)+','+y(Number(r[it.key]||0))).join(' ');paths+='<polyline fill="none" stroke="'+COLORS[j]+'" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" points="'+pts+'"/>';rows.forEach((r,i)=>{let val=Number(r[it.key]||0);paths+='<circle cx="'+x(i)+'" cy="'+y(val)+'" r="4.5" fill="'+COLORS[j]+'" stroke="white" stroke-width="2"><title>'+fmtShort(r.date)+' · '+it.name+': '+fmt(val)+'</title></circle>';if((n<=9||i===0||i===n-1)&&j===0)paths+='<text x="'+x(i)+'" y="'+Math.max(15,y(val)-12)+'" text-anchor="middle" fill="#172338" font-size="12" font-weight="700">'+fmt(val)+'</text>'})});
rows.forEach((r,i)=>{if(n>11&&i%2&&! (i===n-1))return;paths+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle" fill="#667085" font-size="12">'+fmtShort(r.date)+'</text>'});
return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução diária por data">'+paths+'</svg></div>'+legend(items)}
function bars(rows,items){if(!rows.length)return '<div class="empty">Sem dados no período.</div>';let W=1060,H=320,L=60,R=20,T=38,B=44,max=Math.max(1,...rows.flatMap(r=>items.map(it=>+r[it.key]||0))), ymax=Math.ceil(max/10)*10||10;let n=rows.length,grp=(W-L-R)/n,bw=Math.min(27,grp/(items.length+1)),graph='';
for(let k=0;k<=4;k++){let val=ymax*k/4,y=T+(1-val/ymax)*(H-T-B);graph+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e8ecf2"/><text x="'+(L-10)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#738095">'+fmt(Math.round(val))+'</text>'}
rows.forEach((r,i)=>{let cx=L+grp*(i+.5);items.forEach((it,j)=>{let v=+r[it.key]||0,h=v/ymax*(H-T-B),x=cx+(j-(items.length-1)/2)*bw*1.12-bw/2,y=T+(H-T-B)-h;graph+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,0.1)+'" rx="3" fill="'+COLORS[j]+'"><title>'+fmtShort(r.date)+' · '+it.name+': '+fmt(v)+'</title></rect>';if(n<=8&&v)graph+='<text x="'+(x+bw/2)+'" y="'+Math.max(16,y-6)+'" text-anchor="middle" font-size="11" fill="#344054" font-weight="700">'+fmt(v)+'</text>'});if(n<=12||i%2===0||i===n-1)graph+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="#667085">'+fmtShort(r.date)+'</text>'});
return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Barras por dia">'+graph+'</svg></div>'+legend(items)}
function panel(title,description,body){return '<section class="panel"><h3>'+escapeHtml(title)+'</h3><div class="desc">'+escapeHtml(description)+'</div>'+body+'</section>'}
function table(rows,cols){return '<div class="scroll"><table class="data-table"><thead><tr>'+cols.map(c=>'<th>'+escapeHtml(c.label)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice().reverse().map(r=>'<tr>'+cols.map(c=>'<td>'+escapeHtml(c.date?formatDate(r[c.key]):fmt(r[c.key]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(){let p=pages[state.page],rs=state.rows,last=rs.at(-1),prev=rs.at(-2);$('#page-title').textContent=p[0];$('#page-sub').textContent=p[1];$('#count').textContent=rs.length+' data(s)';document.querySelectorAll('.tab').forEach(t=>{let active=t.dataset.page===state.page;t.classList.toggle('active',active);t.setAttribute('aria-selected',String(active))});if(!rs.length){$('#root').innerHTML='<div class="panel empty">Não existem dados demonstrativos para o intervalo escolhido.</div>';return}
let content='',tiles='',dateCols=[{key:'date',label:'Data',date:true}];if(state.data?.mode==='REAL_AGGREGATED'&&(state.page==='insucessos'||state.page==='erros')){$('#root').innerHTML='<div class="panel empty">Esta página ainda não possui integração de dados reais. Os valores demonstrativos foram ocultados para não apresentar informação incorreta.</div>';return;}switch(state.page){
case'producao':tiles='<div class="grid">'+metric('Rotas expedidas',fmt(sum(rs,'routesOut')),'Assigned + Complete')+metric('Rotas no piso',fmt(sum(rs,'routesFloor')),'Rotas ainda no piso')+metric('Pacotes expedidos',fmt(sum(rs,'packagesOut')),'Total demonstrativo')+metric('Pacotes no piso',fmt(sum(rs,'packagesFloor')),'Total demonstrativo')+'</div>';content=panel('Rotas por dia','Expedidas e rotas no piso; passe o mouse para ver os valores.',bars(rs,[{name:'Expedidas',key:'routesOut'},{name:'No piso',key:'routesFloor'}]))+panel('Pacotes por dia','Dados sintéticos; nenhuma informação do SPX foi publicada.',bars(rs,[{name:'Expedidos',key:'packagesOut'},{name:'No piso',key:'packagesFloor'}]))+panel('Resumo diário','Dados fictícios utilizados somente para testar a interface.',table(rs,[...dateCols,{key:'routesOut',label:'Rotas expedidas'},{key:'routesFloor',label:'Rotas no piso'},{key:'packagesOut',label:'Pacotes expedidos'},{key:'packagesFloor',label:'Pacotes no piso'}]));break;
case'atribuicao':{let variation=last&&prev?((last.assigned+last.complete)-(prev.assigned+prev.complete)):null;let relative=variation===null||!(prev.assigned+prev.complete)?null:variation/(prev.assigned+prev.complete)*100;tiles='<div class="grid">'+metric('Atribuídas na última data',fmt(last.assigned+last.complete),'Total diário')+metric('Assigned',fmt(last.assigned),'Última data disponível')+metric('Complete',fmt(last.complete),'Última data disponível')+metric('Variação diária',variation===null?'—':(variation>=0?'+':'')+fmt(variation)+' rotas',relative===null?'Sem comparação':pct(relative)+' vs. data anterior')+'</div>';content=panel('Evolução da atribuição de rotas','Comparação diária do total, Assigned e Complete.',lineChart(rs,[{name:'Total atribuído',key:'assignedTotal'},{name:'Assigned',key:'assigned'},{name:'Complete',key:'complete'}]))+panel('Histórico de atribuições','Status separados por data de atribuição.',table(rs,[...dateCols,{key:'assigned',label:'Assigned'},{key:'complete',label:'Complete'},{key:'assignedTotal',label:'Total'}]));break}
case'insucessos':tiles='<div class="grid">'+metric('Insucessos',fmt(sum(rs,'failures')),'Período filtrado')+metric('BRs únicos',fmt(sum(rs,'uniqueBR')),'Demonstração')+metric('Tratativas concluídas',fmt(sum(rs,'resolved')),'Demonstração')+metric('Pendentes',fmt(sum(rs,'failures')-sum(rs,'resolved')),'Demonstração')+'</div>';content=panel('Evolução de insucessos','Quantidade de registros fictícios por data.',lineChart(rs,[{name:'Insucessos',key:'failures'},{name:'Tratados',key:'resolved'}]))+panel('Resumo diário','Somente registros demonstrativos.',table(rs,[...dateCols,{key:'failures',label:'Insucessos'},{key:'uniqueBR',label:'BRs únicos'},{key:'resolved',label:'Tratados'}]));break;
case'erros':tiles='<div class="grid">'+metric('Erros de etiquetagem',fmt(sum(rs,'labelErrors')),'Período filtrado')+metric('Erros de expedição',fmt(sum(rs,'shippingErrors')),'Período filtrado')+metric('Datas analisadas',fmt(rs.length),'Demonstração')+metric('Total de ocorrências',fmt(sum(rs,'labelErrors')+sum(rs,'shippingErrors')),'Demonstração')+'</div>';content=panel('Evolução dos erros','Comparativo diário demonstrativo.',bars(rs,[{name:'Etiquetagem',key:'labelErrors'},{name:'Expedição',key:'shippingErrors'}]))+panel('Resumo diário','Sem dados de operadores ou rastreios reais.',table(rs,[...dateCols,{key:'labelErrors',label:'Etiquetagem'},{key:'shippingErrors',label:'Expedição'}]));break}
$('#root').innerHTML=tiles+'<div class="section"><h2>Visão analítica</h2><p>Todas as informações desta página são simuladas.</p></div>'+content+'<div class="notes"><strong>Fonte:</strong> '+(state.data?.mode==='REAL_AGGREGATED'?'indicadores agregados da planilha Validação de Dados. Totais de pacotes podem ser parciais quando há quantidades pendentes.':'dados inteiramente fictícios, utilizados para testar a atualização automática.')+'</div>'}
function apply(){if(!state.data)return;let s=$('#start').value,e=$('#end').value;state.rows=state.data.days.filter(r=>(!s||r.date>=s)&&(!e||r.date<=e));render()}
async function load(){const s=$('#start').value,e=$('#end').value;$('#updated').textContent='Atualizando…';try{let res=await fetch('./data/indicadores.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)res=await fetch('./data/indicadores-demo.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();if(!['DEMO','REAL_AGGREGATED'].includes(data.mode)||!Array.isArray(data.days))throw Error('Formato de dados inválido');data.days.forEach(r=>r.assignedTotal=(+r.assigned||0)+(+r.complete||0));state.data=data;let sorted=data.days.slice().sort((a,b)=>a.date.localeCompare(b.date));data.days=sorted;if(!s&&sorted.length)$('#start').value=sorted[0].date;if(!e&&sorted.length)$('#end').value=sorted.at(-1).date;$('#updated').textContent=(data.mode==='REAL_AGGREGATED'?'Dados agregados · ':'Demonstração · ')+new Date(data.generatedAt).toLocaleString('pt-BR');document.querySelector('.demo').textContent=data.mode==='REAL_AGGREGATED'?'DADOS AGREGADOS · PUBLICAÇÃO AUTORIZADA':'DADOS DEMONSTRATIVOS';apply()}catch(err){$('#updated').textContent='Falha de atualização';$('#root').innerHTML='<div class="notes">Não foi possível carregar os dados demonstrativos: '+escapeHtml(err.message)+'</div>'}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{state.page=t.dataset.page;render()}));['start','end'].forEach(k=>$('#'+k).addEventListener('change',apply));$('#reload').addEventListener('click',load);load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
