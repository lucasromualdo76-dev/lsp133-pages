name: Publicar dashboard LSP 133
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar dados fictícios quando não houver publicação real
        run: |
          if [ ! -f data/indicadores.json ]; then
            node scripts/generate-demo.mjs
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Separar somente arquivos públicos
        run: |
          mkdir -p dist/data
          cp index.html .nojekyll dist/
          if [ -f data/indicadores.json ]; then
            cp data/indicadores.json dist/data/
          else
            cp data/indicadores-demo.json dist/data/
          fi
      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
